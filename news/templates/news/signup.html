<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — AI 뉴스 큐레이션</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 400px;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo h1 { font-size: 1.6rem; font-weight: 700; color: #2d3748; }
    .logo p { margin-top: 0.4rem; font-size: 0.875rem; color: #718096; }

    .field { margin-bottom: 1.25rem; }
    .field label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 0.4rem;
    }
    .field input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: #667eea; }

    .field-help {
      font-size: 0.78rem;
      color: #a0aec0;
      margin-top: 0.3rem;
    }

    .field-errors {
      margin-top: 0.3rem;
    }
    .field-errors li {
      font-size: 0.8rem;
      color: #e53e3e;
      list-style: none;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.5rem;
    }
    .btn:hover { opacity: 0.9; }

    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #718096;
    }
    .login-link a { color: #667eea; font-weight: 600; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>AI 뉴스 큐레이션</h1>
      <p>회원가입 후 서비스를 이용하세요</p>
    </div>

    <form method="post">
      {% csrf_token %}

      {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">
          {% if field.name == "username" %}아이디
          {% elif field.name == "password1" %}비밀번호
          {% elif field.name == "password2" %}비밀번호 확인
          {% else %}{{ field.label }}
          {% endif %}
        </label>
        {{ field }}
        {% if field.help_text %}
        <div class="field-help">{{ field.help_text }}</div>
        {% endif %}
        {% if field.errors %}
        <ul class="field-errors">
          {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
        {% endif %}
      </div>
      {% endfor %}

      <button type="submit" class="btn">회원가입</button>
    </form>

    <div class="login-link">
      이미 계정이 있으신가요? <a href="{% url 'login' %}">로그인</a>
    </div>
  </div>
</body>
</html>
